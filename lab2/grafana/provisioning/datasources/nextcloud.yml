apiVersion: 1

datasources:
  - name: Loki
    uid: nextcloud-loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: Zabbix
    uid: nextcloud-zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-front:8080/api_jsonrpc.php
    jsonData:
      authType: userLogin
      username: $ZABBIX_API_USER
      trends: false
      cacheTTL: 1m
    secureJsonData:
      password: $ZABBIX_API_PASSWORD
